spring.application.name=focusleaf

# Le variaveis locais de um arquivo .env na raiz do projeto, se existir.
# O .env nao vai para o Git. Variaveis de ambiente reais (Docker, pipeline) tem prioridade.
spring.config.import=optional:file:.env[.properties]

# Porta HTTP. Plataformas de hospedagem costumam injetar a variavel PORT.
server.port=${PORT:8080}

# MongoDB (Spring Boot 4: propriedade "spring.mongodb.uri").
# O valor padrao serve apenas para desenvolvimento local, sem senha.
# Em staging e producao a URI deve vir da variavel MONGODB_URI (secret).
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/focusleaf}

# Identificacao da instancia, exibida em GET /api/info
focusleaf.ambiente=${APP_AMBIENTE:local}
focusleaf.versao=@project.version@
focusleaf.commit=${APP_COMMIT:desconhecido}

# Actuator: apenas o health check fica exposto
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
